  <script>
    (() => {
      const track=document.getElementById('track'),slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.rail button')],prev=document.getElementById('prev'),next=document.getElementById('next'),progress=document.getElementById('progress'),currentNumber=document.getElementById('currentNumber');let current=0,startX=0,startY=0;
      const go=index=>{const target=Math.max(0,Math.min(slides.length-1,index));current=target;track.style.transform=`translate3d(${-target*100}%,0,0)`;slides.forEach((slide,i)=>slide.classList.toggle('is-active',i===target));dots.forEach((dot,i)=>{dot.classList.toggle('is-active',i===target);if(i===target)dot.setAttribute('aria-current','step');else dot.removeAttribute('aria-current')});prev.disabled=target===0;next.disabled=target===slides.length-1;progress.style.width=`${(target+1)/slides.length*100}%`;currentNumber.textContent=String(target+1).padStart(2,'0');history.replaceState(null,'',`#slide-${target+1}`)};
      prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));dots.forEach((dot,index)=>dot.addEventListener('click',()=>go(index)));
      addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();go(current-1)}if(event.key==='Home')go(0);if(event.key==='End')go(slides.length-1)});
      track.addEventListener('touchstart',event=>{startX=event.changedTouches[0].clientX;startY=event.changedTouches[0].clientY},{passive:true});track.addEventListener('touchend',event=>{const dx=event.changedTouches[0].clientX-startX,dy=event.changedTouches[0].clientY-startY;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))go(current+(dx<0?1:-1))},{passive:true});
