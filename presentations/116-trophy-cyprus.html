<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>116 Trophy Cyprus LTD — Презентация · anestiiz</title>
  <meta name="description" content="Презентация клуба 116 Trophy Cyprus LTD — гонки, тренировки и партнёрская программа на Achna Speedway.">
  <link rel="icon" type="image/png" href="../assets/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicon/favicon.png">
  <style>
    @font-face{font-family:"AkzidenzGroteskPro";src:url("../assets/fonts/akzidenzgroteskpro-regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"AkzidenzGroteskPro";src:url("../assets/fonts/akzidenzgroteskpro-md.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
    @font-face{font-family:"AkzidenzGroteskPro";src:url("../assets/fonts/akzidenzgroteskpro-bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
    @font-face{font-family:"Manrope";src:url("../assets/fonts/Manrope-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Manrope";src:url("../assets/fonts/Manrope-Medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
    @font-face{font-family:"Manrope";src:url("../assets/fonts/Manrope-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
    @font-face{font-family:"Manrope";src:url("../assets/fonts/Manrope-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}

    :root{--bg:#000;--ink:#f4edf2;--muted:#bbaeb4;--soft:#8d8090;--line:rgba(255,255,255,.14);--pink:#ff006a;--pad:clamp(20px,3.8vw,64px);--max:1680px}
    *{box-sizing:border-box}
    html,body{width:100%;max-width:100%;overflow-x:clip}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:#000;color:var(--ink);font-family:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;color-scheme:dark}
    a{color:inherit;text-decoration:none}
    h1,h2{font-family:"AkzidenzGroteskPro","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500}
    .wrap{width:min(100%,var(--max));margin:auto;padding-inline:var(--pad)}

    header{position:sticky;top:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
    .header-row{height:74px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
    .back-link{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);transition:.2s ease}
    .back-link:hover{color:var(--ink)}
    .back-link .icon-arrow-left{width:18px;height:18px;filter:invert(98%) sepia(8%) saturate(530%) hue-rotate(283deg) brightness(102%) contrast(92%);opacity:.78}
    .logo{justify-self:center;font-size:20px;font-weight:700;letter-spacing:-.04em}
    .header-right{justify-self:end;font-size:14px;color:var(--soft)}

    .case-hero{padding-top:clamp(48px,6vw,96px);padding-bottom:clamp(32px,4vw,64px)}
    .case-eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#c084fc;margin-bottom:20px}
    .case-hero h1{margin:0;font-size:clamp(48px,7vw,112px);line-height:.92;letter-spacing:-.045em}
    .case-lead{margin-top:24px;max-width:680px;font-size:clamp(17px,1.6vw,22px);line-height:1.4;color:var(--muted);letter-spacing:-.02em}

    .slides{display:flex;flex-direction:column;gap:clamp(20px,3vw,40px);padding-bottom:clamp(60px,8vw,120px)}
    .slide-frame{display:block;width:100%;border-radius:clamp(12px,1.4vw,24px);overflow:hidden;background:#0a0410;box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04)}
    .slide-frame img{display:block;width:100%;height:auto}

    footer{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:20px var(--pad) 24px;font-size:12px;border-top:1px solid var(--line);color:var(--soft)}
    footer .top{justify-self:center}

    @media(max-width:640px){
      .header-row{grid-template-columns:auto 1fr auto;height:64px}
      .logo{font-size:17px}
      .header-right{display:none}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-row">
      <a class="back-link" href="../index.html#presentations"><img class="icon-arrow-left" src="../Icons/Arrow Down.svg" alt="" style="transform:rotate(90deg)">К работам</a>
      <div class="logo">anestiiz</div>
      <div class="header-right">Презентация</div>
    </div>
  </header>

  <main>
    <section class="case-hero wrap">
      <div class="case-eyebrow">Презентация · 2026</div>
      <h1>116 Trophy Cyprus LTD</h1>
      <p class="case-lead">Гоночный клуб на Achna Speedway: тренировки, соревнования и партнёрская программа на 6 месяцев.</p>
    </section>

    <section class="wrap">
      <div class="slides">
        <div class="slide-frame"><img src="../assets/media/presentations/116-trophy-cyprus/1.png" alt="Слайд 1" loading="lazy"></div>
        <div class="slide-frame"><img src="../assets/media/presentations/116-trophy-cyprus/2.png" alt="Слайд 2" loading="lazy"></div>
        <div class="slide-frame"><img src="../assets/media/presentations/116-trophy-cyprus/3.png" alt="Слайд 3" loading="lazy"></div>
        <div class="slide-frame"><img src="../assets/media/presentations/116-trophy-cyprus/4.png" alt="Слайд 4" loading="lazy"></div>
        <div class="slide-frame"><img src="../assets/media/presentations/116-trophy-cyprus/5.png" alt="Слайд 5" loading="lazy"></div>
      </div>
    </section>
  </main>

  <footer>
    <div>© 2026 anestiiz</div>
    <a class="top" href="#top">Наверх ↑</a>
    <div></div>
  </footer>
</body>
</html>
